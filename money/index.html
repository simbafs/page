<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Money Manager Analysis</title>
		<script src="https://d3js.org/d3.v7.min.js"></script>
		<style>
			body {
				font-family: sans-serif;
				background-color: #f5f5f5;
				margin: 0;
				padding: 1rem;
				color: #333;
			}

			h1,
			h2 {
				text-align: center;
			}

			a {
				color: #007bff;
				text-decoration: none;
			}
			a:hover {
				text-decoration: underline;
			}

			.card {
				background-color: #ffffff;
				border-radius: 12px;
				box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
				padding: 1.5rem;
				margin: 1rem auto;
				max-width: 900px;
			}

			.card h2 {
				margin-top: 0;
			}

			#file-upload input[type='file'] {
				margin-top: 0.5rem;
			}

			#charts > .card {
				margin-bottom: 2rem;
			}

			svg {
				max-width: 100%;
				height: auto;
			}

			.pie-chart {
				display: grid;
				grid-template-columns: 1fr 1fr;
				place-items: center;
			}
			.pie-chart :nth-child(1) {
				grid-column: span 2;
			}

			@media (max-width: 600px) {
				.pie-chart {
					grid-template-columns: 1fr;
				}
				.pie-chart :nth-child(1) {
					grid-column: unset;
				}
			}
		</style>
	</head>
	<body>
		<h1>Money Manager Analysis</h1>
		<div class="card">
			<p>
				這是一個網頁，可以把
				<a
					href="https://play.google.com/store/apps/details?id=com.ktwapps.walletmanager&pcampaignid=web_share"
					target="_blank"
					>Money Manager</a
				>
				所匯出的 CSV 視覺化資料的網頁。大部分程式由 ChatGPT 完成，紀錄
				<a href="https://chatgpt.com/share/676efb19-b1d8-800e-88ea-85f5573f454f">在這</a> 。
			</p>
			<p>
				你可以在 錢包 > 設定 > 導出 找到匯出 CSV
				的選項。種類選擇「紀錄」，格式選擇「.csv」，錢包、開始、結束按照你的需求選擇即可。
			</p>
		</div>

		<div id="file-upload" class="card">
			<label for="csvFileInput">Upload CSV File:</label>
			<input type="file" id="csvFileInput" accept=".csv" />
		</div>

		<div id="charts"></div>

		<script>
			// Entity
			class Transaction {
				constructor(date, type, category, amount, currency, memo, wallet) {
					this.date = new Date(date) // Assume input is a string that can be parsed
					this.type = type
					this.category = category
					this.amount = +amount
					this.currency = currency
					this.memo = memo
					this.wallet = wallet
				}
			}

			class Category {
				constructor(name, totalAmount) {
					this.name = name
					this.totalAmount = totalAmount
				}
			}

			// Use case
			class TransactionProcessor {
				static parseCSV(text) {
					return d3.csvParse(
						text,
						d => new Transaction(d.日期, d.種類, d.類別, d.數目, d.貨幣, d.備忘錄, d.錢包),
					)
				}

				static processMonthlyData(data) {
					const monthlyData = d3.group(data, d => d3.timeFormat('%Y-%m')(d.date))
					return Array.from(monthlyData, ([month, entries]) => {
						const income = d3.sum(
							entries.filter(e => e.type === '收入'),
							e => e.amount,
						)
						const expense = d3.sum(
							entries.filter(e => e.type === '支出'),
							e => -e.amount,
						)
						return { month, income, expense, net: income - expense }
					})
				}

				static processCumulativeAssets(monthlySummary) {
					const cumulativeAssets = []
					let cumulative = 0
					monthlySummary.forEach(d => {
						cumulative += d.net
						cumulativeAssets.push({ month: d.month, cumulative })
					})
					return cumulativeAssets
				}

				static processCategoryData(data, type) {
					return d3.rollup(
						data.filter(d => d.type === type),
						v => d3.sum(v, d => (type === '收入' ? d.amount : -d.amount)),
						d => d.category,
					)
				}

				static processWalletUsage(data) {
					return d3.rollup(
						data.filter(d => d.type !== '轉賬'),
						v => d3.sum(v, d => Math.abs(d.amount)),
						d => d.wallet,
					)
				}
			}

			// Interface adapter
			class ChartRenderer {
				static clearPreviousCharts() {
					d3.selectAll('svg').remove()
				}

				static createContainer(opts = {}) {
					const container = document.createElement('div')
					container.className = 'card ' + (opts?.className || '')
					document.getElementById('charts').appendChild(container)
					return container
				}

				static title(container, title) {
					const titleElement = document.createElement('h2')
					titleElement.innerText = title
					container.appendChild(titleElement)
				}

				static renderLineChart(chartData, xKey, yKey, title) {
					const container = this.createContainer()

					this.title(container, title)

					const parent = d3.select(container).node()
					const fullWidth = parent.clientWidth // ⬅️ 取得容器寬度

					const margin = { top: 20, right: 30, bottom: 40, left: 50 }
					const width = fullWidth - margin.left - margin.right
					const height = 300 - margin.top - margin.bottom

					const yValues = chartData.map(d => d[yKey])
					const mean = d3.mean(yValues)
					const stdDev = d3.deviation(yValues)

					const svg = d3
						.select(container)
						.append('svg')
						.attr('width', width + margin.left + margin.right)
						.attr('height', height + margin.top + margin.bottom)
						.append('g')
						.attr('transform', `translate(${margin.left},${margin.top})`)

					const x = d3
						.scalePoint()
						.domain(chartData.map(d => d[xKey]))
						.range([0, width])
					const y = d3
						.scaleLinear()
						.domain([
							0,
							Math.min(
								d3.max(chartData, d => d[yKey]),
								mean + 2 * stdDev,
							),
						])
						.nice()
						.range([height, 0])
					const line = d3
						.line()
						.x(d => x(d[xKey]))
						.y(d => y(d[yKey]))

					svg.append('path')
						.datum(chartData)
						.attr('fill', 'none')
						.attr('stroke', 'steelblue')
						.attr('stroke-width', 1.5)
						.attr('d', line)

					svg.append('g')
						.attr('transform', `translate(0,${height})`)
						.call(
							d3.axisBottom(x).tickFormat((d, i) => {
								const month = d.split('-')[1]
								return month === '01' || month === '07' ? d : ''
							}),
						)
					svg.append('g').call(d3.axisLeft(y))
				}

				static renderPieChart(chartData, title) {
					const container = this.createContainer({ className: 'pie-chart' })

					this.title(container, title)

					const parent = d3.select(container).node()
					const fullWidth = parent.clientWidth // ⬅️ 取得容器寬度

					const size = Math.min(fullWidth / 2 - 40, 300) // ⬅️ 設定圓形圖的大小
					const radius = size / 2

					const svg = d3
						.select(container)
						.append('svg')
						.attr('width', size)
						.attr('height', size)
						.append('g')
						.attr('transform', `translate(${radius},${radius})`)

					const color = d3.scaleOrdinal().domain(Array.from(chartData.keys())).range(d3.schemeSet2)
					const pie = d3
						.pie()
						.value(d => d[1])
						.sort((a, b) => b[1] - a[1])
					const data_ready = pie(Array.from(chartData))

					svg.selectAll('.arc')
						.data(data_ready)
						.enter()
						.append('path')
						.attr('d', d3.arc().innerRadius(0).outerRadius(radius))
						.attr('fill', d => color(d.data[0]))
						.attr('stroke', 'white')
						.style('stroke-width', '2px')

					const legend = d3.select(container).append('div')
					// .style('display', 'inline-block')

					data_ready
						.toSorted((a, b) => b.value - a.value)
						.forEach(d => {
							const percentage = (d.data[1] / d3.sum(data_ready, d => d.data[1])) * 100
							if (percentage > 5) {
								legend
									.append('div')
									.style('display', 'flex')
									.style('align-items', 'center')
									.style('margin-bottom', '5px').html(`
			                         <div style="width: 10px; height: 10px; background-color: ${color(d.data[0])}; margin-right: 5px;"></div>
			                         <div>${d.data[0]}: ${d.data[1]} (${percentage.toFixed(2)}%)</div>
			                     `)
							}
						})
				}
			}

			// Framework and Driver
			class CSVFileHandler {
				static handleFileUpload(event) {
					const file = event.target.files[0]
					if (file) {
						const reader = new FileReader()
						reader.onload = function (e) {
							const text = e.target.result
							const parsedData = TransactionProcessor.parseCSV(text)
							const monthlySummary = TransactionProcessor.processMonthlyData(parsedData)
							const cumulativeAssets = TransactionProcessor.processCumulativeAssets(monthlySummary)
							const incomeCategory = TransactionProcessor.processCategoryData(parsedData, '收入')
							const expenseCategory = TransactionProcessor.processCategoryData(parsedData, '支出')
							const walletUsage = TransactionProcessor.processWalletUsage(parsedData)

							ChartRenderer.clearPreviousCharts()
							ChartRenderer.renderLineChart(monthlySummary, 'month', 'income', 'Monthly Income')
							ChartRenderer.renderLineChart(monthlySummary, 'month', 'net', 'Monthly Net Change')
							ChartRenderer.renderLineChart(cumulativeAssets, 'month', 'cumulative', 'Cumulative Assets')
							ChartRenderer.renderPieChart(incomeCategory, 'Income by Category')
							ChartRenderer.renderPieChart(expenseCategory, 'Expense by Category')
							ChartRenderer.renderPieChart(walletUsage, 'Wallet Usage')
						}
						reader.readAsText(file)
					}
				}
			}

			document.getElementById('csvFileInput').addEventListener('change', CSVFileHandler.handleFileUpload)
		</script>
	</body>
</html>
